name: Create release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
jobs:
  build:
    name: Create release and build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: "Build Changelog"
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          configuration: "changelog.config.json"
          commitMode: true

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body: ${{steps.build_changelog.outputs.changelog}}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup model export Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare De-JPEG model
        run: ./tools/dejpeg/prepare.ps1

      - name: Publish
        env:
          DOTNET_PROCESSOR_COUNT: '4'
        run: dotnet publish screenzap/Screenzap.csproj -c Release -nr:false -m:1 -p:UseSharedCompilation=false -o ${{ github.workspace }}\publish\Screenzap

      - name: Package app, runtime and model
        run: Compress-Archive -Path publish/Screenzap/* -DestinationPath publish/Screenzap.zip

      - name: upload windows artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}\publish\Screenzap.zip
          asset_name: Screenzap-${{ github.ref_name }}.zip
          asset_content_type: application/zip
